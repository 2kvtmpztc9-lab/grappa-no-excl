data:
  data_module:
    datasets:
    - spice-dipeptide
    pure_test_datasets: []
    pure_val_datasets: []
    pure_train_datasets: []
    splitpath: null
    partition:
    - 0.8
    - 0.1
    - 0.1
    train_batch_size: 32
    val_batch_size: 32
    ref_terms: []
    train_loader_workers: 4
    val_loader_workers: 4
    test_loader_workers: 4
    conf_strategy: 32
    ff_lookup: {}
    seed: 0
    pin_memory: true
    tr_subsampling_factor: null
    tr_max_confs: null
    weights:
      rna-diverse: 3
      rna-nucleoside: 5
      spice-pubchem: 0.8
    balance_factor: 0.0
    val_conf_strategy: 200
    max_energy: null
  energy:
    terms:
    - bond
    - angle
    - proper
    - improper
    gradients: true
    gradient_contributions: false
experiment:
  ckpt_path: null
  ckpt_cfg_override: false
  use_wandb: false
  wandb:
    name: grappa-no-excl-spice
    project: grappa-experiment
    save_code: true
    tags: []
  checkpointer:
    dirpath: ckpt/${experiment.wandb.project}/${experiment.wandb.name}/${now:%Y-%m-%d}_${now:%H-%M-%S-%f}
    monitor: early_stopping_loss
    mode: min
    save_top_k: 1
    save_last: true
    every_n_epochs: 5
    auto_insert_metric_name: false
    filename: epoch:{epoch}-early_stop_loss:{early_stopping_loss:.2f}
  progress_bar: true
  trainer:
    overfit_batches: 0
    min_epochs: 5
    max_epochs: 1000
    accelerator: gpu
    log_every_n_steps: 10
    deterministic: false
    check_val_every_n_epoch: 1
  evaluation:
    n_bootstrap: 1
  train:
    lr: 0.0001
    energy_weight: 1.0
    gradient_weight: 3.0
    start_qm_epochs: 0
    param_loss_epochs: 0
    warmup_steps: 500
    early_stopping_energy_weight: 3.0
    param_weight: 0.0
    proper_regularisation: 1.0
    improper_regularisation: 1.0
    weight_decay: 0
    patience: -1
    lr_decay: 1.0
    tuplewise_weight: 0.0
    time_limit: 47.5
    reset_optimizer_on_load: false
    add_noise_on_load: 0.0
model:
  graph_node_features: 256
  in_feats: null
  in_feat_name:
  - atomic_number
  - ring_encoding
  - partial_charge
  - degree
  in_feat_dims: {}
  gnn_width: 512
  gnn_attentional_layers: 4
  gnn_convolutions: 0
  gnn_attention_heads: 16
  gnn_dropout_attention: 0.3
  gnn_dropout_initial: 0.0
  gnn_dropout_conv: 0.0
  gnn_dropout_final: 0.1
  symmetric_transformer_dropout: 0.5
  symmetric_transformer_depth: 1
  symmetric_transformer_n_heads: 8
  symmetric_transformer_width: 512
  symmetriser_depth: 4
  symmetriser_width: 256
  n_periodicity_proper: 3
  n_periodicity_improper: 2
  gated_torsion: true
  positional_encoding: true
  layer_norm: true
  self_interaction: true
  learnable_statistics: false
  torsion_cutoff: 0.0001
  harmonic_gate: false
  only_n2_improper: true
  stat_scaling: true
  shifted_elu: true
